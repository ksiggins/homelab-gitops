apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn-dashboard-homepage
  namespace: longhorn-system
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Longhorn"
    gethomepage.dev/description: "Distributed block storage system"
    gethomepage.dev/group: "Infrastructure"
    gethomepage.dev/icon: "longhorn.png"
    gethomepage.dev/href: "https://longhorn.staging.lab.supermorphic.com"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=longhorn-manager"
    gethomepage.dev/widget.type: "longhorn"
    gethomepage.dev/widget.url: "https://longhorn.staging.lab.supermorphic.com"
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`longhorn-homepage.local`)
      services:
        - kind: Service
          name: longhorn-frontend
          namespace: longhorn-system
          port: 80
