apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-dashboard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01-staging
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.staging.lab.supermorphic.com`)
      kind: Rule
      services:
        - name: grafana-frontend
          port: 80
  tls:
    secretName: grafana-dashboard-tls
