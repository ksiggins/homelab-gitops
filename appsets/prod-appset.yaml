apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prod-appset
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/ksiggins/homelab-gitops.git
        revision: appsets
        directories:
          - path: components/*/envs/prod
  template:
    metadata:
      name: '{{index .path.segments 1}}-{{index .path.segments 3}}'
      annotations:
        argocd.argoproj.io/sync-wave: >
          {{- if eq (index .path.segments 1) "cert-manager" -}}1
          {{- else if eq (index .path.segments 1) "traefik" -}}2
          {{- else if eq (index .path.segments 1) "longhorn" -}}3
          {{- else -}}4
          {{- end -}}
      labels:
        env: prod
        app.kubernetes.io/part-of: homelab-gitops
    spec:
      project: default
      source:
        repoURL: https://github.com/ksiggins/homelab-gitops.git
        targetRevision: appsets
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{index .path.segments 1}}-{{index .path.segments 3}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
