apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-overlay
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/ksiggins/homelab-gitops.git
    targetRevision: main
    path: manifests/traefik/overlay
  destination:
    name: https://kubernetes.default.svc
    namespace: traefik-v2
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
