apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-dashboard
  namespace: monitoring-staging
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Grafana"
    gethomepage.dev/description: "Observability and visualization dashboard"
    gethomepage.dev/group: "Monitoring"
    gethomepage.dev/icon: "grafana.png"
    gethomepage.dev/href: "https://grafana.staging.lab.supermorphic.com"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=grafana"
    gethomepage.dev/widget.type: "grafana"
    gethomepage.dev/widget.version: "2"
    gethomepage.dev/widget.url: "https://grafana.staging.lab.supermorphic.com"
    gethomepage.dev/widget.username: "admin"
    gethomepage.dev/widget.password: "Nd3$5vK7PeyyQ7*d27r0#XkVX2gE1BAzzZVEJERA"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.staging.lab.supermorphic.com`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
  tls:
    secretName: grafana-dashboard-tls
