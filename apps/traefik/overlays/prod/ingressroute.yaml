apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik-v2-prod
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`traefik.lab.supermorphic.com`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService
      middlewares:
        - name: dashboard-basicauth
  tls:
    secretName: traefik-dashboard-tls
