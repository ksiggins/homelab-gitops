apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.10.0
    helm:
      releaseName: longhorn
      values: |
        preUpgradeChecker:
          jobEnabled: false
        defaultSettings:
          backupTarget: "cifs://192.168.0.3/Longhorn"
          backupTargetCredentialSecret: nas-credential-secret
          snapshotDataIntegrity: enabled
          backupCompressionMethod: gzip
        longhornManager:
          tolerations:
            - effect: NoSchedule
              operator: Exists
        metrics:
          serviceMonitor:
            enabled: false
  destination:
    name: in-cluster
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
