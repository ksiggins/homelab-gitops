apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage-dashboard
  namespace: homepage-staging
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Homepage"
    gethomepage.dev/description: "Unified homelab dashboard"
    gethomepage.dev/group: "Cluster Management"
    gethomepage.dev/icon: "si:homepage"
    gethomepage.dev/href: "https://homepage.staging.lab.supermorphic.com"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=homepage"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`homepage.staging.lab.supermorphic.com`)
      kind: Rule
      services:
        - name: homepage
          port: 80
  tls:
    secretName: homepage-dashboard-tls
