apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage-staging
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    traefik: true
    ingress: true
    showPodCount: true

  settings.yaml: |
    title: "Homelab Dashboard"
    theme: dark
    layout:
      - Monitoring
      - Infrastructure
      - Networking
    providers:
      longhorn:
        url: https://longhorn.staging.lab.supermorphic.com

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "Cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
    - longhorn:
        expanded: true
        total: true
        labels: true
        nodes: true

  docker.yaml: ""
  proxmox.yaml: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: homelabe-gitops
              href: https://github.com/ksiggins/homelab-gitops
        - Github:
            - abbr: homelabe-playbook
              href: https://github.com/ksiggins/homelab-playbook
  services.yaml: ""
  custom.css: ""
  custom.js: ""
