apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage-staging
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    traefik: true
    ingress: true
    showPodCount: true

  settings.yaml: |
    title: "Homelab Dashboard"
    theme: dark
    layout:
      - Monitoring
      - Infrastructure
      - Networking

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "Cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank

  docker.yaml: ""
  proxmox.yaml: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/
  services.yaml: |
    - Infrastructure:
        - Auto-discovered Services:
            description: "Discovered via Traefik annotations"
  custom.css: ""
  custom.js: ""
