apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
spec:
  template:
    spec:
      containers:
        - name: homepage
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: homepage.staging.lab.supermorphic.com
            - name: HOMEPAGE_VAR_ARGOCD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: argocd-api-token
                  key: api-token
