apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-overlay
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/ksiggins/homelab-gitops.git
    targetRevision: main
    path: manifests/longhorn/overlay
  destination:
    name: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
