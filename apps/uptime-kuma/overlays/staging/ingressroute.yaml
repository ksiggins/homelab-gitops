apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: uptime-kuma
  namespace: uptime-kuma-staging
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Uptime Kuma"
    gethomepage.dev/description: "Self-hosted monitoring dashboard"
    gethomepage.dev/group: "Monitoring"
    gethomepage.dev/icon: "uptime-kuma.svg"
    gethomepage.dev/href: "https://uptime-kuma.staging.lab.supermorphic.com/"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=uptime-kuma"
    gethomepage.dev/widget.type: "uptimekuma"
    gethomepage.dev/widget.url: "https://uptime-kuma.staging.lab.supermorphic.com"
    gethomepage.dev/widget.slug: "homelab"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`uptime-kuma.staging.lab.supermorphic.com`)
      kind: Rule
      services:
        - name: uptime-kuma
          port: 3001
  tls:
    secretName: uptime-kuma-tls
