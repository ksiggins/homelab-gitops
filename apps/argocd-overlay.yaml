apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-overlay
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/ksiggins/homelab-gitops.git
    targetRevision: main
    path: manifests/argocd/overlay
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
