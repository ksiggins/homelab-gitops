apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd-staging
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`argocd.staging.lab.supermorphic.com`)
      kind: Rule
      services:
        - name: argocd-server
          namespace: argocd
          port: 80
  tls:
    secretName: argocd-server-tls
