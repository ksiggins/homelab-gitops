apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd-prod
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`argocd.lab.supermorphic.com`)
      kind: Rule
      services:
        - name: argocd-server
          namespace: argocd
          port: 443
          scheme: https
  tls:
    secretName: argocd-server-tls
