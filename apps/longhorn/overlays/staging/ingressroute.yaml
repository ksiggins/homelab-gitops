apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn-dashboard
  namespace: longhorn-system-staging
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Longhorn"
    gethomepage.dev/description: "Distributed block storage"
    gethomepage.dev/group: "Infrastructure"
    gethomepage.dev/icon: "longhorn.png"
    gethomepage.dev/href: "https://longhorn.staging.lab.supermorphic.com"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=longhorn-manager"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`longhorn.staging.lab.supermorphic.com`)
      kind: Rule
      services:
        - name: longhorn-frontend
          namespace: longhorn-system
          port: 80
  tls:
    secretName: longhorn-dashboard-tls
