apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-dashboard-certificate
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  secretName: grafana-dashboard-tls
  dnsNames:
    - grafana.lab.supermorphic.com
  issuerRef:
    name: letsencrypt-dns01-production
    kind: ClusterIssuer
