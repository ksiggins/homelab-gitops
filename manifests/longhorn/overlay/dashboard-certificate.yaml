apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: longhorn-dashboard-certificate
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretName: longhorn-dashboard-tls
  dnsNames:
    - longhorn.lab.supermorphic.com
  issuerRef:
    name: letsencrypt-dns01-production
    kind: ClusterIssuer
