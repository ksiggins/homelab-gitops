apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-server-certificate
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretName: argocd-server-tls
  dnsNames:
    - argocd.lab.supermorphic.com
  issuerRef:
    name: letsencrypt-dns01-production
    kind: ClusterIssuer
